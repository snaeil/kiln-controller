[project]
name = "kiln-controller"
version = "0.1.0"
description = "Turns a Raspberry Pi into an inexpensive, web-enabled kiln controller"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "bottle>=0.13.4",
    "gevent>=26.7.0",
    "gevent-websocket>=0.10.1",
    "greenlet>=3.2.5",
    "requests>=2.32.5",
    "setuptools>=82.0.1",
    "websocket-client>=1.9.0",
    # for folks running raspberry pis
    # we have no proof of anyone using another board yet, but when that
    # happens, you might want to comment this out.
    # rpi-lgpio provides the RPi.GPIO module that adafruit blinka
    # depends on, and works with newer kernels/Pi models where the
    # original RPi.GPIO package is unmaintained.
    "rpi-lgpio>=0.6",
    # List of all supported adafruit modules for thermocouples
    "adafruit-circuitpython-bitbangio>=1.3.22",
    "adafruit-circuitpython-max31855>=3.3.0",
    # for folks using sw spi (bit banging)
    "adafruit-circuitpython-max31856>=0.12.7",
    # mqtt telemetry (optional - only used when mqtt_enable is set in config.py)
    "paho-mqtt>=2.1.0",
    # untested - for PT100 platinum thermocouples
    # "adafruit-circuitpython-max31865>=2.2.27"
    # untested - for mcp9600 and mcp9601
    # "adafruit-circuitpython-mcp9600>=2.0.10"
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "pytest>=8.4.2",
    "ruff>=0.16.7",
    "tomli>=2.4.1",
]

[tool.ruff]
line-length = 100
exclude = ["venv", ".git"]

[tool.ruff.lint]
select = ["F"] # Pyflakes style linting

[tool.pytest.ini_options]
testpaths = ["Test"]
