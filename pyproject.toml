[project]
name = "kiln-controller"
version = "0.1.0"
description = "Turns a Raspberry Pi into an inexpensive, web-enabled kiln controller"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "adafruit-circuitpython-bitbangio>=1.3.22",
    "adafruit-circuitpython-max31855>=3.3.0",
    "adafruit-circuitpython-max31856>=0.12.7",
    "bottle>=0.13.4",
    "gevent>=26.7.0",
    "gevent-websocket>=0.10.1",
    "greenlet>=3.2.5",
    "requests>=2.32.5",
    "rpi-gpio>=0.7.1",
    "setuptools>=82.0.1",
    "websocket-client>=1.9.0",
]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "mypy>=1.19.1",
    "pylint>=3.3.9",
    "pyscan-rs>=2.1.3",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kiln-controller"]

