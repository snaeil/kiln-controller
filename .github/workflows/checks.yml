name: Python checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          # Install project requirements if present
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Install the tools we will run
          # TODO: use versions
          pip install black pytest mypy pylint bandit pyscan-rs
      - name: Run black
        run: |
          black --check .
      - name: Run pytest
        run: |
          pytest -v
      - name: Run mypy
        run: |
          mypy .
      - name: Run pylint
        run: |
          pylint --rcfile=.pylintrc */**.py
          pylint tests --rcfile=.pylintrc.tests
      - name: Run bandit
        run: |
          bandit -r .
      - name: Run pyscan
        run: |
          pyscan .
